name: Deployment

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      deploy_contract:
        description: 'Deploy Soroban contract to Stellar Testnet'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Next.js Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Vercel Credentials
        id: check-secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials detected. Proceeding with deployment."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials missing. Skipping deployment steps safely."
          fi

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts for Vercel
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-contract:
    name: Deploy Soroban Contract (Stellar Testnet)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 25.0.0

      - name: Build Soroban Contract WASM
        run: cargo build --manifest-path contracts/scholarpay/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Deploy Soroban Contract to Testnet
        run: |
          stellar contract deploy \
            --wasm contracts/scholarpay/target/wasm32-unknown-unknown/release/scholarpay.wasm \
            --source ${{ secrets.STELLAR_SECRET_KEY }} \
            --network testnet
